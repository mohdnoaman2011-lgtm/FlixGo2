name: flixgo
description: FlixGo - video and audio downloader UI.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  video_player: ^2.9.2
  http: ^1.2.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.1.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

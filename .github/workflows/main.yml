name: Build FlixGo APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find the Flutter project folder
        run: |
          PUBSPEC=$(find . -name pubspec.yaml -not -path './.git/*' -not -path '*/.dart_tool/*' -not -path '*/build/*' | head -n 1)
          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml was not found in the repository. Files in the repo:"
            find . -not -path './.git/*' -type f | head -n 100
            exit 1
          fi
          DIR=$(dirname "$PUBSPEC")
          echo "Flutter project folder: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android folder if missing
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -d android ]; then
            cp lib/main.dart /tmp/main.dart
            cp pubspec.yaml /tmp/pubspec.yaml
            flutter create . --project-name flixgo --platforms=android
            cp /tmp/main.dart lib/main.dart
            cp /tmp/pubspec.yaml pubspec.yaml
            rm -rf test
          fi

      - name: Allow internet access in release build (for fonts)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
          fi

      - name: Get packages
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flixgo-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
